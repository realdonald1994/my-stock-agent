name: Run Tiered Stock Agent (EST Optimized)
on:
  schedule:
    # Converting EST/EDT to UTC (UTC-4)
    # Full List: 9:34 AM and 4:34 PM EST (Offset to avoid congestion)
    - cron: '34 13,20 * * *'
    
    # Priority Only: 1:12 PM and 9:12 PM EST (Offset to avoid peak hour)
    - cron: '12 17,1 * * *'
  
  # Keep this so you can always trigger it manually for earnings news
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    env:
      # Ensures we use the modern 2026 Node engine for all actions
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install requests google-genai
        
      - name: Execute Agent
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
