name: Run Stock Agent
on:
  schedule:
    - cron: '0 13,21 * * *' # Runs at 9:00 AM and 5:00 PM EST
  workflow_dispatch:      # Allows you to click a button to run it manually

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    # This environment variable tells the runner to use Node 24 for all steps
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6 # Updated to v6
        
      - name: Setup Python
        uses: actions/setup-python@v6 # Updated to v6
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install requests google-generativeai
        
      - name: Execute Agent
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
